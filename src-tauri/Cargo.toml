[package]
name = "lol-master-tracker"
version = "1.0.0"
description = "LoL Master Track — solo q discipline app"
authors = ["Maks"]
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["system-tray"] }
windows-sys = { version = "0.48", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["tauri/system-tray"]
custom-protocol = ["tauri/custom-protocol", "tauri/system-tray"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
